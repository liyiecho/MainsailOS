- name: armbian-msm8916-bookworm
  type: armbian
  img_download_url: "https://github.com/liyiecho/armbian-msm8916/releases/latest/download/Armbian.img.xz"
  img_hash_url: "https://github.com/liyiecho/armbian-msm8916/releases/latest/download/Armbian.img.xz.sha256"
  env:
    ARCH: arm64
    DISTRO: armbian
    IMAGE_ENLARGEROOT: 2500
    MOUNT_PROC: 0
    MOUNT_SYS: 1
  special_modules: []
  rpi_json:
    name: "MainsailOS $VERSION$ - MSM8916"
    description: "A port of Armbian with preinstalled Klipper/Moonraker/Mainsail for 3D printers"
    icon: "https://os.mainsail.xyz/rpi-imager.png"
    devices:
      - "msm8916"
